name: dilang
description: DiLang — Offline-first, local-first Personal Language Operating System (OS).
version: 2.0.0
publish_to: 'none'

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqlite3: ^2.4.5
  crypto: ^3.0.3
  path: ^1.9.0
  equatable: ^2.0.5
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
