[workspace]
members = [
    "crates/dilang_core",
    "crates/dilang_fsrs",
    "crates/dilang_sqlite",
    "crates/dilang_models",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DiLang Core Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/dilang-org/dilang"
homepage = "https://dilang.org"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
flutter_rust_bridge = "2.0"
