name: mobile
description: DiLang Privacy-First Local-First AI-Native Language Learning Platform (Mobile Shell)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Flutter Rust Bridge FFI
  flutter_rust_bridge: ^2.8.0

  # System Paths & Storage
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  sqlite3_flutter_libs: ^0.5.42
  shared_preferences: ^2.5.5

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.20.5
  go_router: ^13.2.5

  # Data Classes & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.6.0
  collection: ^1.19.1

  # Media & Hardware Permissions
  permission_handler: ^11.4.0
  record: ^5.2.1
  just_audio: ^0.9.46

  # Logging & Localization
  intl: ^0.19.0
  logging: ^1.3.0

dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/logos/icon/
    - assets/logos/full/
    - assets/logos/monochrome/
