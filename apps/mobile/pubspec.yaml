name: mobile
description: DiLang Privacy-First Local-First AI-Native Language Learning Platform (Mobile Shell)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Flutter Rust Bridge FFI
  flutter_rust_bridge: ^2.8.0

  # System Paths & Storage
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  sqlite3_flutter_libs: ^0.5.21
  shared_preferences: ^2.2.2

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0

  # Data Classes & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  collection: ^1.18.0

  # Media & Hardware Permissions
  permission_handler: ^11.3.0
  record: ^5.1.0
  just_audio: ^0.9.36

  # Logging & Localization
  intl: ^0.19.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
